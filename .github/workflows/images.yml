# .github/workflows/images.yml
#
# Tests, then builds the app image from this commit and pushes it to
# GitHub's container registry as ghcr.io/<owner>/<repo>, tagged with the
# commit (and :latest from master). Pull requests test and build without
# pushing. No secrets are needed: the run's own token publishes the image.
#
# Built for amd64 and arm64 (Go cross-compiles; the final stage only
# installs Debian packages, which buildx does under emulation). Pushing a
# version tag (git tag v1.2.3) also publishes :1.2.3, with the version
# stamped into the app.
name: Build image

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The same tools as the app image, so the PDF and compressed-DICOM
      # tests run instead of being skipped.
      - name: Poppler and GDCM
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils libgdcm-tools tesseract-ocr

      - name: Vet and test
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt"; exit 1; }
          go vet ./...
          go test ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, for git describe

      - name: Image name (from the repository; registry names must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Tags and version (the commit always; latest from master; the version from a v* tag)
        run: |
          {
            echo 'TAGS<<EOF'
            echo "$IMAGE:$GITHUB_SHA"
            if [ "$GITHUB_REF" = refs/heads/master ]; then echo "$IMAGE:latest"; fi
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "$IMAGE:${GITHUB_REF_NAME#v}"; fi
            echo EOF
          } >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"; else echo "VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"; fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub's container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for amd64 and arm64 (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ env.TAGS }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
